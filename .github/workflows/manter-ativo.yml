# Verifica disponibilidade; o HD3D usa a VPS e não depende da pausa do Supabase Free.
name: Verificar HD3D na VPS

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar site e autenticação por HTTPS
        env:
          ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzk0ODIzMDczLCJleHAiOjE5NTI1MDMwNzN9.RxDSpfgjQTVgy-HYcwyFXT4-Y43JINXpFyvAyE-76zU
        run: |
          curl --fail --silent --show-error --retry 2 --max-time 30 --output /dev/null https://hd3d.otimodespachante.com.br/
          curl --fail --silent --show-error --retry 2 --max-time 30 --output /dev/null -H "apikey: $ANON_KEY" https://api-hd3d.otimodespachante.com.br/auth/v1/health
